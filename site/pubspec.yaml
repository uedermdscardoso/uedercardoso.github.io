name: site
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/uedercardoso.jpeg

  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/open_sans/static/OpenSans-Regular.ttf 
        - asset: assets/fonts/open_sans/static/OpenSans-Bold.ttf
        - asset: assets/fonts/open_sans/static/OpenSans-Italic.ttf
          style: italic
  #  - family: Trajan Pro
  #    fonts:
  #      - asset: fonts/TrajanPro.ttf
  #      - asset: fonts/TrajanPro_Bold.ttf
  #        weight: 700
  